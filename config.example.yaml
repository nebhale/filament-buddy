# Copy to config.yaml. Changes take effect after restart.
http:
  address: ":8080"
metrics:
  address: ":8514"
  advertised_host: "192.168.1.50" # dockerpi's LAN IP, where the relay listens
  advertised_port: 8514 # defaults to the listening port
spoolman:
  url: "http://host.docker.internal:7912" # reachable inside the container
  timeout: 5s
# URL credentials may be used for an upstream Basic-auth proxy. Keep config private.
data_dir: /data
printers:
  - id: c1 # 1–9 lowercase letters/digits, hyphens or underscores
    name: "Prusa CORE One"
    # source_ip: "172.20.0.1" # optional OBSERVED sender, often this network's gateway
    # With a relay, filter the original printer IP at the relay. Verify the
    # consumer's gateway before setting this guard; do not copy another network's IP.
